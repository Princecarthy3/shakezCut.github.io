<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Book Appointment | Shakez Cut</title>
    <link rel="icon" href="img/favicon.png">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#111;
            color:white;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:auto;
        }

        header{
            background:#000;
            padding:20px 0;
            text-align:center;
            border-bottom:2px solid #d4af37;
        }

        header h1{
            color:#d4af37;
            font-size:40px;
        }

        header p{
            margin-top:10px;
            color:#ccc;
        }

        .appointment-section{
            display:flex;
            flex-wrap:wrap;
            gap:40px;
            padding:60px 0;
            align-items:center;
            justify-content:center;
        }

        .appointment-image{
            flex:1;
            min-width:300px;
        }

        .appointment-image img{
            width:100%;
            border-radius:15px;
        }

        .appointment-form{
            flex:1;
            min-width:300px;
            background:#1b1b1b;
            padding:35px;
            border-radius:15px;
        }

        .appointment-form h2{
            color:#d4af37;
            margin-bottom:25px;
            text-align:center;
        }

        form{
            display:flex;
            flex-direction:column;
        }

        input, select, textarea{
            margin-bottom:18px;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        textarea{
            resize:none;
            height:100px;
        }

        button{
            background:#d4af37;
            color:black;
            padding:15px;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:white;
        }

        footer{
            text-align:center;
            padding:20px;
            background:#000;
            color:#aaa;
            margin-top:40px;
        }

        a{
            display:block;
            text-align:center;
            margin:20px 0;
            color:#d4af37;
            text-decoration:none;
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <h1>Shakez Cut</h1>
        <p>Book Your Haircut Appointment Easily</p>
    </div>
</header>

<section class="appointment-section container">

    <div class="appointment-image">
        <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1200&auto=format&fit=crop" alt="Barber Shop">
    </div>

    <div class="appointment-form">
        <h2>Book Appointment</h2>

        <form id="appointmentForm">
            <input type="text" name="full_name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="tel" name="phone" placeholder="Phone Number" maxlength="10" required>

            <select name="service" required>
                <option value="">Select Service</option>
                <option value="Haircut">Haircut</option>
                <option value="Beard Trim">Beard Trim</option>
                <option value="Hair Coloring">Hair Coloring</option>
            </select>

            <input type="date" name="appointment_date" required>

            <input type="time" name="appointment_time" required>

            <textarea name="notes" placeholder="Additional Notes"></textarea>

            <button type="submit">Book Now</button>
        </form>
    </div>

</section>

<a href="index.html"><i>Back to Home Page</i></a>

<footer>
    <p>© 2026 Shakez Cut | All Rights Reserved</p>
</footer>

<!-- SUPABASE SCRIPT -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl = "https://vgqyzscgvkjqjfifdntt.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZncXl6c2NndmtqcWpmaWZkbnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MjE4MTksImV4cCI6MjA5NTQ5NzgxOX0.muvKaQn6VThRawkusWtT1SsnSBeZg6d8J0-kcXFBBx8";

const supabase = createClient(supabaseUrl, supabaseKey);

document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("appointmentForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const { error } = await supabase
            .from("appointments")
            .insert([{
                full_name: form.full_name.value,
                email: form.email.value,
                phone: form.phone.value,
                service: form.service.value,
                appointment_date: form.appointment_date.value,
                appointment_time: form.appointment_time.value,
                notes: form.notes.value
            }]);

        if (error) {
            console.error(error);
            alert("Booking failed: " + error.message);
        } else {
            alert("Appointment booked successfully!");
            form.reset();
        }
    });
});
</script>

</body>
</html>
